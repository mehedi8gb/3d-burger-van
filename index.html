*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

#stage{position:fixed;inset:0;touch-action:none;cursor:grab;outline:none}

.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));pointer-events:none}

.seg{display:flex;border:1px solid var(--chipb);border-radius:999px;background:var(--chip);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:3px}

.msg.done{opacity:0}

function showMsg(t){const m=document.getElementById('msg');m.textContent=t;m.classList.remove('done');}
function load(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

function init(){
const THREE=window.THREE;
const stage=document.getElementById('stage');
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let R;
try{R=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});}catch(e){showMsg('This browser has WebGL turned off, so the 3D view can’t start.');return;}
const small=Math.min(window.innerWidth,window.innerHeight)<700;
R.shadowMap.enabled=true;R.outputEncoding=THREE.sRGBEncoding;
stage.appendChild(R.domElement);

function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}

const blob=tex(256,256,(g)=>{const gr=g.createRadialGradient(128,128,10,128,128,126);gr.addColorStop(0,'rgba(0,0,0,0.5)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);});
const bl=new THREE.Mesh(new THREE.PlaneGeometry(36,24),new THREE.MeshBasicMaterial({map:blob,transparent:true,depthWrite:false}));bl.rotation.x=-Math.PI/2;bl.position.set(-0.5,0.02,0);scene.add(bl);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.ShadowMaterial({opacity:0.3}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

const amb=new THREE.HemisphereLight(0xffffff,0x8a8070,0.85);scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff2dd,0.95);sun.position.set(-14,30,18);sun.castShadow=true;
const ms=small?1024:2048;sun.shadow.mapSize.set(ms,ms);sun.shadow.bias=-0.0006;
const sc=sun.shadow.camera;sc.left=-26;sc.right=26;sc.top=26;sc.bottom=-26;sc.far=100;scene.add(sun);

const glow3=new THREE.PointLight(0xFFB347,0,10);glow3.position.set(2,12,0);scene.add(glow3);

const root=document.documentElement;
const theme=document.getElementById('themeColor');
const mDay=document.getElementById('mDay'),mDusk=document.getElementById('mDusk');
function setMode(m){
  const dusk=m==='dusk';
  root.setAttribute('data-mode',m);
  amb.intensity=dusk?0.3:0.85;amb.color.set(dusk?0x8fa3c8:0xffffff);
  sun.intensity=dusk?0.12:0.95;
  glow.intensity=dusk?1.6:0;glow2.intensity=dusk?0.9:0;glow3.intensity=dusk?0.8:0;

}
mDay.onclick=()=>setMode('day');mDusk.onclick=()=>setMode('dusk');
setMode('day');

const target=new THREE.Vector3(-0.5,9.5,0);
let th=0.7,ph=0.28,zoom=1,fitDist=44,auto=!reduce,vt=null,shutTarget=0;
const pointers=new Map();let pinch=0;

function fit(){
  const w=stage.clientWidth||window.innerWidth,h=stage.clientHeight||window.innerHeight;
  R.setPixelRatio(Math.min(window.devicePixelRatio||1,small?1.75:2));
  R.setSize(w,h,false);
  cam.aspect=w/h;cam.updateProjectionMatrix();
  fitDist=Math.max(40,38/cam.aspect);
}
fit();
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);

const clampZoom=()=>{zoom=Math.max(0.4,Math.min(1.7,zoom));};
function syncAuto(){document.getElementById('tAuto').setAttribute('aria-pressed',String(auto));}
function stopAuto(){if(auto){auto=false;syncAuto();}}
function goView(t,p){
  stopAuto();
  const d=(((t-th+Math.PI)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)-Math.PI;
  if(reduce){th=th+d;ph=p;vt=null;}else{vt={t:th+d,p:p};}
}

stage.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{stage.setPointerCapture(e.pointerId);}catch(x){}
  stage.classList.add('drag');vt=null;stopAuto();
  if(pointers.size===2){const a=[...pointers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
stage.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);if(!p)return;
  if(pointers.size===1){
    th-=(e.clientX-p.x)*0.008;ph=Math.max(0.02,Math.min(1.4,ph+(e.clientY-p.y)*0.006));
    p.x=e.clientX;p.y=e.clientY;
  }else if(pointers.size===2){
    p.x=e.clientX;p.y=e.clientY;
    const a=[...pointers.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch>0&&d>0){zoom*=pinch/d;clampZoom();}
    pinch=d;
  }
});
function up(e){pointers.delete(e.pointerId);pinch=0;if(!pointers.size)stage.classList.remove('drag');}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();zoom*=Math.exp(e.deltaY*0.0012);clampZoom();},{passive:false});
stage.addEventListener('keydown',e=>{
  const k=e.key;let used=true;
  if(k==='ArrowLeft'){th-=0.12;}else if(k==='ArrowRight'){th+=0.12;}
  else if(k==='ArrowUp'){ph=Math.min(1.4,ph+0.08);}else if(k==='ArrowDown'){ph=Math.max(0.02,ph-0.08);}
  else if(k==='+'||k==='='){zoom*=0.9;clampZoom();}else if(k==='-'){zoom*=1.1;clampZoom();}
  else used=false;
  if(used){e.preventDefault();vt=null;stopAuto();}
});

const card=document.getElementById('card'),cardT=document.getElementById('cardT'),cardD=document.getElementById('cardD');
let picked=-1;
const hs=HOT.map((h,i)=>{
  const b=document.createElement('button');b.className='hs';b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',h.t);
  b.innerHTML='<i></i><span></span>';b.querySelector('span').textContent=h.t;
  b.onclick=()=>pick(i);hsWrap.appendChild(b);
  return {b:b,v:new THREE.Vector3(h.p[0],h.p[1],h.p[2])};
});
function pick(i){
  picked=(picked===i)?-1:i;
  hs.forEach((o,j)=>o.b.setAttribute('aria-pressed',String(j===picked)));
  if(picked<0){card.hidden=true;return;}
  cardT.textContent=HOT[picked].t;cardD.textContent=HOT[picked].d;card.hidden=false;
}

const tmp=new THREE.Vector3();
let first=true;
function loop(){
  requestAnimationFrame(loop);
  if(vt){th+=(vt.t-th)*0.12;ph+=(vt.p-ph)*0.12;if(Math.abs(vt.t-th)<0.002&&Math.abs(vt.p-ph)<0.002){th=vt.t;ph=vt.p;vt=null;}}
  else if(auto&&!pointers.size){th+=0.0035;}
  shutter.rotation.x+=(shutTarget-shutter.rotation.x)*0.12;
  const dist=Math.max(16,Math.min(110,fitDist*zoom));
  cam.position.set(target.x+dist*Math.cos(ph)*Math.sin(th),target.y+dist*Math.sin(ph),target.z+dist*Math.cos(ph)*Math.cos(th));
  cam.lookAt(target);cam.updateMatrixWorld();
  R.render(scene,cam);
  if(!hsWrap.hidden){
    const w=stage.clientWidth,h=stage.clientHeight;
    for(let i=0;i<hs.length;i++){
      tmp.copy(hs[i].v).project(cam);
      const b=hs[i].b;
      if(tmp.z>1||tmp.z<-1){b.style.display='none';}
      else{b.style.display='flex';b.style.transform='translate('+((tmp.x*0.5+0.5)*w).toFixed(1)+'px,'+((-tmp.y*0.5+0.5)*h).toFixed(1)+'px)';}
    }
  }
  if(first){first=false;document.getElementById('msg').classList.add('done');}
}
loop();
}
